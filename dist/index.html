<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ed"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="單字小花園"><title>單字小花園 · 聽讀冒險</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="#" aria-label="回到花園首頁"><span class="logo">✿</span><span>單字小花園<small>WORD GARDEN</small></span></a><nav aria-label="主要導覽"><button data-tab="home" class="active">🌱 我的花園</button><button data-tab="stars">⭐ 星星口袋 <span id="star-count">0</span></button><button data-tab="history">📅 成長日記</button></nav><button id="settings-button" class="icon-button" aria-label="語音設定">⚙</button></header>
<section class="pwa-bar" aria-label="安裝與離線狀態"><span id="offline-status" role="status">正在準備離線練習…</span><div><button id="update-game" hidden>更新遊戲 ↻</button><button id="install-game">＋ 安裝遊戲</button></div></section><main id="app"></main><div id="toast" role="status"></div>
<dialog id="settings"><form method="dialog"><button class="close" aria-label="關閉">×</button><h2>🔊 聲音小幫手</h2><p>選一個英文聲音，跟著一起讀。</p><label>英文聲音<select id="voice"></select></label><label>朗讀速度<select id="speed"><option value="0.65">慢慢讀</option><option value="0.85">舒服的速度</option><option value="1">正常速度</option></select></label><button type="button" class="primary" id="test-voice">🔊 試聽 hello</button><p class="muted">發音由裝置的英文語音提供。首次使用請開啟音量；可在裝置設定安裝英文語音。</p><p id="voice-status" role="status"></p></form></dialog>
<dialog id="install-help"><form method="dialog"><button class="close" aria-label="關閉安裝說明">×</button><h2>🌱 把花園放在主畫面</h2><p>電腦與 Android：在支援的瀏覽器選單選擇「安裝應用程式」或「新增至主畫面」。</p><p>iPhone／iPad：用 Safari 開啟遊戲，點「分享」→「加入主畫面」。</p><p class="muted">等上方顯示「已備妥離線練習」後，就能離線複習、測驗、收藏星星與記日記。瀏覽器清除網站資料會移除紀錄及離線快取。</p><p class="muted">英文朗讀需裝置具備本機英文語音；麥克風辨識需要網路。安裝後請先連線開啟一次。</p></form></dialog><script src="data.js"></script><script src="speech.js"></script><script src="app.js"></script><script src="pwa.js"></script></body></html>
